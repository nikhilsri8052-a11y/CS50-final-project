{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block content %}

<div class="auth-wrap">
    <div class="auth-card glass">
        <h1>Create account</h1>
        <p class="sub">Start your AI-powered study journey</p>

        <form action="/register" method="post" id="registerForm">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Choose a username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="pw-wrap">
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Create a password" autocomplete="new-password" required>
                    <button type="button" class="pw-toggle" onclick="togglePw('password',this)">Show</button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirm">Confirm Password</label>
                <div class="pw-wrap">
                    <input type="password" class="form-control" id="confirm" name="confirm"
                           placeholder="Repeat your password" autocomplete="new-password"
                           oninput="checkMatch()" required>
                    <button type="button" class="pw-toggle" onclick="togglePw('confirm',this)">Show</button>
                </div>
                <div id="matchMsg" style="font-size:.78rem;margin-top:5px;display:none;"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-2">
                Create account →
            </button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>
</div>

<script>
function togglePw(inputId, btn) {
    const inp = document.getElementById(inputId);
    inp.type  = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? 'Show' : 'Hide';
}

function checkMatch() {
    const pw  = document.getElementById('password').value;
    const cf  = document.getElementById('confirm').value;
    const msg = document.getElementById('matchMsg');
    if (!cf) { msg.style.display = 'none'; return; }
    msg.style.display = 'block';
    if (pw === cf) { msg.textContent = '✓ Passwords match'; msg.style.color = 'var(--green)'; }
    else           { msg.textContent = '✗ Passwords do not match'; msg.style.color = 'var(--red)'; }
}
document.getElementById('registerForm')?.addEventListener('submit', function () {
    const submit = this.querySelector('[type="submit"]');
    if (submit) {
        submit.textContent = 'Creating account...';
        submit.disabled = true;
    }
});
</script>

{% endblock %}
